# Tuned for the Zima host: db container capped at 2 GB RAM (no swap), shm_size 1 GB.
# Worst-case memory budget (all within mem_limit 2g):
#   shared_buffers                      512 MB
#   backends: 40 x (work_mem 8 MB x ~2 nodes + ~10 MB overhead) ~= 1040 MB, only if all 40 sort/hash at once
#   (parallel gather workers: max_parallel_workers_per_gather = 1 keeps that to at most 2 x the above per query)
#   maintenance (index build): 256 MB x (1 + 2 parallel workers) = 768 MB, but rarely concurrent with a full query load
#   autovacuum: 2 workers x 64 MB = 128 MB
# Sum: query load 512+1040+128 = ~1.7 GB (fits 2 GB); an index build adds up to 768 MB, so run it while queries are idle.
# Typical use is far below this; the caps exist so the kernel kills Cerebro, never the neighbours.
listen_addresses = '*'
max_connections = 40
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 256MB
autovacuum_work_mem = 64MB
autovacuum_max_workers = 2
max_parallel_maintenance_workers = 2
max_parallel_workers_per_gather = 1
default_toast_compression = lz4
wal_compression = lz4
checkpoint_timeout = 15min
