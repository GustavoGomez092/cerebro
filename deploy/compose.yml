name: cerebro

services:
  db:
    container_name: cerebro-db
    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    command: postgres -c config_file=/etc/postgresql/postgres.conf
    shm_size: 1g
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    oom_score_adj: 500
    environment:
      POSTGRES_USER: cerebro
      POSTGRES_DB: cerebro
    env_file: ${CEREBRO_SECRETS}/db.env # POSTGRES_PASSWORD
    labels:
      # postgres.conf is a single-file bind mount, which compose doesn't watch: deploy.sh renders the file's sha256
      # here, so a changed conf changes the service definition and `up` recreates the db with it.
      cerebro.postgres-conf-sha256: "${POSTGRES_CONF_SHA256:-unset}"
    volumes:
      - ${CEREBRO_DATA}/db:/var/lib/postgresql/data
      - ./postgres.conf:/etc/postgresql/postgres.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cerebro -d cerebro"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [cerebro-net]

  ollama:
    container_name: cerebro-ollama
    image: ollama/ollama:0.12.6@sha256:a61a8fd395dbb931cc8cb1b5da7a2510746575c87113fdc45b647ee59ef7f808
    cpus: ${OLLAMA_CPUS:-4}
    mem_limit: 3g
    memswap_limit: 3g
    oom_score_adj: 500
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ${CEREBRO_DATA}/ollama:/root/.ollama
    restart: unless-stopped
    networks: [cerebro-net]

  server:
    container_name: cerebro-server
    image: cerebro-server:${CEREBRO_TAG}
    # On SIGTERM the summariser lets a Claude call finish for up to 20 s, kills it, waits 2 s, then the embed
    # worker and the database pool close: Docker's default 10 s would SIGKILL it part-way through.
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    env_file: ${CEREBRO_SECRETS}/server.env # DATABASE_URL
    environment:
      EMBED_URL: http://cerebro-ollama:11434
    ports:
      - "127.0.0.1:8790:8790"
    cpus: 2
    mem_limit: 3g
    memswap_limit: 3g
    oom_score_adj: 500
    volumes:
      - ${CEREBRO_DATA}/claude:/data/claude
    restart: unless-stopped
    networks: [cerebro-net, default] # default only publishes the port

  # The web dashboard (web/: TanStack Start + Better Auth). Behind the `web` profile: deploy.sh must build
  # cerebro-web:<tag> (web/Dockerfile) and run compose with --profile web before it starts. It reads the database
  # (its `auth` schema) and calls cerebro-server with the web-ui token, both from web.env; the browser never sees
  # the token. Caddy points the dashboard's name (brain.home.lab) at 127.0.0.1:8792.
  web:
    container_name: cerebro-web
    image: cerebro-web:${CEREBRO_TAG}
    profiles: [web]
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_started
    env_file: ${CEREBRO_SECRETS}/web.env # DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL, CEREBRO_WEB_TOKEN
    environment:
      CEREBRO_URL: http://cerebro-server:8790
    ports:
      - "127.0.0.1:8792:3000"
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m
    oom_score_adj: 500
    restart: unless-stopped
    networks: [cerebro-net, default] # default only publishes the port

networks:
  cerebro-net:
    driver: bridge
    internal: true

# ZimaOS app metadata; plain `docker compose` ignores x- extensions.
x-casaos:
  main: server
  title:
    en_us: Cerebro
  tagline:
    en_us: Private memory server
  icon: https://api.iconify.design/fluent-emoji-flat/brain.svg
  category: Utilities
  port_map: "80"
  hostname: brain.home.lab # the tile opens the dashboard (cerebro-web); the API stays on cerebro.home.lab
  index: /
