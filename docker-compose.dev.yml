services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: cerebro
      POSTGRES_PASSWORD: cerebro
      POSTGRES_DB: cerebro
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cerebro"]
      interval: 2s
      retries: 30
  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["embed"]
    ports:
      - "127.0.0.1:11435:11434"
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://cerebro:cerebro@db:5432/cerebro
      EMBED_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8790:8790"
    depends_on:
      db:
        condition: service_healthy
